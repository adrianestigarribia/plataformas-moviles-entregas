<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Compras</h1>
        <div class="card">
            <div class="card-body">
                <h2>Listado de Productos</h2>

                <ul id="lista-productos">
                    <li>Pan</li>
                </ul>

                <button id="btn-ordenar" class="btn btn-secondary" type="button">Ordenar A-Z</button>
                <button id="btn-limpiar" class="btn btn-danger" type="button">Limpiar lista</button>

                <hr class="hr">

                <h2>Agregar Producto</h2>
                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" aria-label="Nombre del Producto">
                        <button class="btn btn-primary" type="submit">Agregar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        const lista = document.getElementById('lista-productos');

        /**
         * agregarProducto()
         * esta función se va a llamar cuando el usuario envía el formulario con el nombre del producto para agregar.
         */
        function agregarProducto(nombreProducto) {
            nombreProducto = nombreProducto.trim();
            if (nombreProducto === '') return;

            const li = document.createElement('li');
            li.classList.add('my-1');

            const span = document.createElement('span');
            span.textContent = nombreProducto;

            const botonEliminar = document.createElement('button');
            botonEliminar.textContent = 'Eliminar';
            botonEliminar.classList.add('btn', 'btn-sm', 'btn-outline-danger', 'ms-2');
            botonEliminar.addEventListener('click', () => li.remove());

            li.appendChild(span);
            li.appendChild(botonEliminar);
            lista.appendChild(li);
        }

        function limpiarLista() {
            lista.innerHTML = '';
        }

        function ordenarProductos() {
            const productos = Array.from(lista.querySelectorAll('li'));
            productos.sort((a, b) => a.querySelector('span').textContent.localeCompare(b.querySelector('span').textContent));
            productos.forEach(li => lista.appendChild(li));
        }

        function handlerFormulario(evento) {
            evento.preventDefault();
            const input = evento.target.querySelector('input');
            const nombreProducto = input.value;
            input.value = "";
            agregarProducto(nombreProducto);
        }

        document.querySelector('form').addEventListener('submit', handlerFormulario);
        document.getElementById('btn-limpiar').addEventListener('click', limpiarLista);
        document.getElementById('btn-ordenar').addEventListener('click', ordenarProductos);

        // El "Pan" que viene en el HTML se vuelve a cargar con agregarProducto para que tenga su botón de eliminar
        const productosIniciales = Array.from(lista.querySelectorAll('li')).map(li => li.textContent);
        limpiarLista();
        productosIniciales.forEach(producto => agregarProducto(producto));
    </script>
</body>
</html>
